services:
  postgres:
    image: postgres:15
    container_name: chatcheckout_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: chatcheckout
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - chatcheckout-network

  redis:
    image: redis:7-alpine
    container_name: chatcheckout_redis
    command: redis-server --requirepass redis_password_secret
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - chatcheckout-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redis_data:

networks:
  chatcheckout-network:
    driver: bridge
